<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Comm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
<style>
    body {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }
 
    #search {
      width: 20px;
      padding: 8px 12px ;
      margin-bottom: 20px;
      width: 280px;
      font-size: 16px;
    }
 
    .pcontainer {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
 
    .product {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      background: #fafafa;
    }
 
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
      display: flexbox;
    }
 
    .product button {
      width:80px;
      padding: 6px 10px;
      cursor: pointer;
      
      color: #000000;
      border: none;
      border-radius: 4px;
    }
    
    .add-to-cart {
      background: #f85d03;
    }

    .buy-now {
      background: skyblue;
    }
        
    .navbar{
      margin-bottom: 40px;
    }
</style>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">E-Commerce</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pricing</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true"></a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<input type="text" id="search" placeholder="Search Products" id="search"> 
<div class="pcontainer" id="pcontainer"></div>

   <script>
   const products = [
      {
        id: 1,
        name: "Laptop",
        price: 1200,
        description: "High performance laptop",
        image: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/48939256-07cc-56ef-9b7b-8264388b145c/aec8f940-3469-5597-816f-0dd903b3407c.jpg"
      },
      {
        id: 2,
        name: "Headphones",
        price: 80,
        description: "Noise-cancelling headphones",
        image: "https://st.perplexity.ai/estatic/0b226c450798410ac541646c86ec31afd840e5beab817a5d84fa821e7db61981ec84c3b4a3f072a7a2e1899c9fb06c6e58b36259180e70449c5ca8b5b53d2a930104d0f4f93896c58e39b87222d6f6f6b7d6d373d706b838a479a7afb95ae575"
      },
      {
        id: 3,
        name: "Smartphone",
        price: 950,
        description: "Latest model smartphone",
        image: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/58955830-4a11-5c18-ac22-138aafc3ca87/02884775-1b79-58ed-8995-387e7abba1a8.jpg"
      },
      {
        id: 4,
        name: "Keyboard",
        price: 35,
        description: "Mechanical keyboard",
        image: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/4d505e84-9aba-5d2b-a759-714d3bd71907/93c63e83-8c2d-5057-934c-189055abc039.jpg"
      },
      {
        id: 5,
        name: "Smartwatch",
        price: 150,
        description: "Fitness tracking smartwatch",
        image: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/3621c06f-47e6-5cb0-909d-299525fb2e59/4cbaa4b4-65d2-5a5f-bfb2-2f048ee18613.jpg"
      }
    ];

    const pcontainer = document.getElementById("pcontainer");
    const search = document.getElementById("search");

    function display(list) {

    pcontainer.innerHTML = "";

    list.forEach(product => {
    const div = document.createElement("div");

        div.classList.add("product");
        div.innerHTML = `
          <img src='${product.image}' alt='${product.name}' />
       <h3>${product.name}</h3>
          <p>${product.description}</p>
          <p><strong>$${product.price}</strong></p>

         <button class="add-to-cart" onclick="addToCart(${product.id})">Buy Now</button>
          <button class="buy-now" onclick="buyProduct(${product.id})">Add to Cart</button>
i`;
        pcontainer.appendChild(div);
      });
    }    

    display(products);

    search.addEventListener("input", () => {
      const text = search.value.toLowerCase();

      const filtered = products.filter(p =>{
        return p.name.toLowerCase().includes(text) ||
        p.description.toLowerCase().includes(text)
    })
      display(filtered);
    })
    function buyProduct(id) {
    const product = products.find(p => p.id === id);
    alert(product.name + " Added to Cart");
  }

   </script>
</body>
</html>
