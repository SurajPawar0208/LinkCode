<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>

    <button onclick="addCart()">Add to Cart</button>
    <button onclick="removeCart()">Remove From Cart</button>
    <script>
        let a=0;
        function addCart(){
            console.log(++a);
            
        }
        function removeCart(){
            if (a<=0) {
                alert("Cart Is Empty");
            } else {
                console.log(--a);
            } 
        }


    </script>
</body>
</html>
