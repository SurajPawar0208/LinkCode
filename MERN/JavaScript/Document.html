<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="head" onclick="getClick()">Hello World</h1>
    <h2 class="Demo">Heading 2</h2>
    <h3 class="Demo">Heading 3</h3>
    <script>
        let a=document.getElementById("head");
        function getClick(){
            a.innerHTML="You Clicked The Button";
            a.style.color="red";
            a.style.backgroundColor="black";
        }
        let b=document.getElementsByClassName("Demo");
        b[0].style.color="blue";
        b[1].style.color="green";
    </script>
</body>
</html>
