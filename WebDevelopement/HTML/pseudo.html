<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo</title>
    <style>
        a{
            text-decoration: none;
            color: purple;
        }

        a:visited{
            color: coral;
        }

        a:active{
            color: lavender;
        }
        div{
            height: 20px;
            border-radius: 15px;
            width: 50px;
            background-color: rgb(247, 89, 89);
        }

        div:hover{
            height: 300px;
            width: 600px;
            background-color: palevioletred;
           
        }
        button{
            height: 30px;
            width: 60px;
            border-radius: 20px;
            background-color: aqua;
        }
        button:hover{
            background-color: white;
            color: blue;
            border-color: blue;

        }
    </style>
</head>
<body>
    <a href="https://www.google.com">Google</a>
    <div>HOVER</div>
    <button>Submit</button>
</body>
</html>
